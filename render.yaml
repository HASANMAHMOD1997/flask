services:
  - type: web
    name: data-entry-flask
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers=2 --threads=4 --timeout=120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_PATH
        value: /var/data/database.db
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1

