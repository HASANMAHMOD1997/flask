<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>قائمة المُدخلات</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>قائمة المُدخلات</h1>

      <form method="get" action="{{ url_for('list_users') }}" class="card" style="margin-bottom:12px;">
        <label for="q">بحث بالاسم</label>
        <input id="q" name="q" type="text" placeholder="اكتب الاسم للبحث" value="{{ q or '' }}" />
        <div style="display:flex; gap:8px;">
          <button type="submit">بحث</button>
          <a class="btn" href="{{ url_for('list_users') }}">إزالة التصفية</a>
          <a class="btn" href="{{ url_for('export_users', q=q) }}">تصدير إلى Excel</a>
        </div>
      </form>
      {% if users and users|length > 0 %}
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>الاسم</th>
              <th>العمر</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody>
            {% for user in users %}
              <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
                <td>
                  <a class="btn" href="{{ url_for('edit_user', user_id=user[0]) }}">تعديل</a>
                  <form method="post" action="{{ url_for('remove_user', user_id=user[0]) }}" style="display:inline" onsubmit="return confirm('هل أنت متأكد من الحذف؟');">
                    <button class="btn danger" type="submit">حذف</button>
                  </form>
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      {% else %}
        <p class="muted">لا توجد بيانات بعد.</p>
      {% endif %}

      <p><a href="{{ url_for('index') }}">عودة للنموذج</a></p>
    </main>
  </body>
  </html>
