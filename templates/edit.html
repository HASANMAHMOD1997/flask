<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تعديل السجل</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>تعديل السجل #{{ user_id }}</h1>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flash">
            {% for msg in messages %}
              <li>{{ msg }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="post" class="card">
        <label for="name">الاسم</label>
        <input id="name" name="name" type="text" value="{{ name }}" required />

        <label for="age">العمر</label>
        <input id="age" name="age" type="number" min="0" step="1" value="{{ age }}" required />

        <div style="display:flex; gap:8px;">
          <button type="submit">حفظ التعديلات</button>
          <a class="btn" href="{{ url_for('list_users') }}">إلغاء</a>
        </div>
      </form>
    </main>
  </body>
  </html>
